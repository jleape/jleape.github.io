<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <rect width="100" height="100" fill="#262625"/>
  <g transform="translate(50 38)" stroke="#C9983C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- crossed wrench + screwdriver -->
    <g transform="rotate(-30)">
      <line x1="-14" y1="0" x2="10" y2="0"/>
      <path d="M 10 -3 A 4 4 0 0 1 14 -3 L 14 3 A 4 4 0 0 1 10 3 Z" fill="#C9983C"/>
      <circle cx="-14" cy="0" r="4"/>
    </g>
    <g transform="rotate(30)">
      <line x1="-14" y1="0" x2="9" y2="0"/>
      <rect x="9" y="-2" width="6" height="4" fill="#B5482E"/>
      <rect x="-17" y="-3" width="3" height="6" fill="#B5482E"/>
    </g>
  </g>
  <text x="50" y="70" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="500" fill="#B5482E" text-anchor="middle" letter-spacing="-0.4">Gambiarra</text>
  <text x="50" y="86" font-family="'IBM Plex Mono', Menlo, monospace" font-size="4.6" fill="#9A9186" text-anchor="middle" letter-spacing="1.4">OPEN &#183; LOCAL &#183; VERIFIED</text>
</svg>
